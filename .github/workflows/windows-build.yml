        },
        {
          "name": "Run reviewed replacement lane once",
          "timeout-minutes": 20,
          "run": "$ErrorActionPreference='Stop'\n$preparedRoot=(Join-Path $env:RUNNER_TEMP 'wf-lifecycle-inputs-fe459d3fef2240f29b2938ab272a421e')\n$prepared=Get-Content -LiteralPath (Join-Path $preparedRoot 'prepared.json') -Raw | ConvertFrom-Json\n$review=Join-Path $preparedRoot 'review'\n$controller=Join-Path $review 'harness/controller.ps1';$common=Join-Path $review 'harness/common.ps1'\nif((Get-FileHash -LiteralPath $controller).Hash.ToLowerInvariant() -cne '348c10367abe090b2651d3464733070b0f5eabe8656f5108475f9e15342804b7' -or (Get-FileHash -LiteralPath $common).Hash.ToLowerInvariant() -cne 'f145dfd880b17074e8c640a738ac4d5c1bafcf6469045ac4899aca81da7a9daf'){throw 'Controller bootstrap identity mismatch'}\n& $controller -ReviewRoot $review -Artifacts (Join-Path $preparedRoot 'artifacts') -Authorization (Join-Path $preparedRoot 'authorization.json') -AuthorizationSha256 $prepared.authorization_sha256 -SourceManifestSha256 '29c381125dde0ff53f927e3e6da987ed0acc276405454add7caa62f9d2711c4d' -Lane replacement\nif($LASTEXITCODE -ne 0){exit $LASTEXITCODE}\n"
