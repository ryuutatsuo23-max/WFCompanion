{
  "name": "Installer lifecycle qualification - F1 R1 N1 only",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "approval_code": {
          "description": "Separately authorized exact plan ID; no default approval",
          "required": true,
          "type": "string"
        },
        "expected_revision": {
          "description": "Exact independently checked workflow-branch commit SHA",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "wf-lifecycle-2e7e1e8a225345d6ad550fa556daa826",
    "cancel-in-progress": false
  },
  "jobs": {
    "fresh": {
      "name": "Lifecycle fresh",
      "runs-on": "windows-2025",
      "timeout-minutes": 45,
      "defaults": {
        "run": {
          "shell": "pwsh"
        }
      },
      "env": {
        "PYTHONDONTWRITEBYTECODE": "1",
        "PYTHONNOUSERSITE": "1",
        "WF_APPROVAL": "${{ inputs.approval_code }}",
        "WF_REVISION": "${{ inputs.expected_revision }}"
      },
      "steps": [
        {
          "name": "Validate separately authorized hosted dispatch",
          "timeout-minutes": 1,
          "run": "$ErrorActionPreference='Stop'\nif($env:GITHUB_EVENT_NAME -ne 'workflow_dispatch' -or $env:GITHUB_RUN_ATTEMPT -ne '1' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $env:RUNNER_OS -ne 'Windows'){throw 'First-attempt hosted Windows dispatch required'}\nif($env:GITHUB_REPOSITORY -ne 'ryuutatsuo23-max/WFCompanion' -or $env:COMPUTERNAME -in @('RYUU','Drago2')){throw 'Unexpected host/repository'}\nif($env:WF_APPROVAL -cne '2e7e1e8a225345d6ad550fa556daa826' -or $env:WF_REVISION -cnotmatch '^[a-f0-9]{40}$' -or $env:WF_REVISION -cne $env:GITHUB_SHA){throw 'Explicit exact-revision approval required'}\nif((Get-CimInstance Win32_OperatingSystem).Caption -notlike '*Windows Server 2025*' -or -not [Environment]::Is64BitProcess -or $PSVersionTable.PSVersion.Major -lt 7){throw 'Reviewed x64 Server 2025 / PowerShell 7 environment required'}\n$principal=[Security.Principal.WindowsPrincipal]::new([Security.Principal.WindowsIdentity]::GetCurrent())\nif(-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)){throw 'Hosted setup administrator unavailable; no elevation fallback'}\n"
        },
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "name": "Authenticate exact capsule and installer inputs",
          "timeout-minutes": 10,
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "$ErrorActionPreference='Stop'\nfunction Assert-CheckoutBytes {\n    param([Parameter(Mandatory)][string]$Path,\n          [Parameter(Mandatory)][ValidateSet('prepare_hosted.py','execution-plan.json','execution-capsule.zip')][string]$Name,\n          [Parameter(Mandatory)][ValidatePattern('^[a-f0-9]{64}$')][string]$ExpectedHash,\n          [Parameter(Mandatory)][ValidateRange(0,1048576)][long]$ExpectedSize)\n    # Failure metadata only: no decoded source, absolute path, environment or exception message.\n    $record=[ordered]@{schema=1;kind='checkout-authentication-failure';file=$Name;reason='read-failed';expected_sha256=$ExpectedHash;expected_bytes=$ExpectedSize;observed_sha256=$null;observed_bytes=$null;lf=$null;crlf=$null;bare_cr=$null}\n    try {\n        if((Get-Item -LiteralPath $Path -Force).Attributes -band [IO.FileAttributes]::ReparsePoint){throw 'Linked checkout input'}\n        $stream=[IO.File]::Open($Path,[IO.FileMode]::Open,[IO.FileAccess]::Read,[IO.FileShare]::Read)\n        try {\n            $length=$stream.Length;$record.observed_bytes=$length\n            if($length -gt 1048576){$record.reason='size-bound'}\n            else {\n                $bytes=[byte[]]::new([int]$length);$offset=0\n                while($offset -lt $bytes.Length){$count=$stream.Read($bytes,$offset,$bytes.Length-$offset);if($count -eq 0){throw 'Short checkout read'};$offset+=$count}\n                if($stream.ReadByte() -ne -1 -or $stream.Length -ne $length){throw 'Checkout input changed'}\n                $record.observed_sha256=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()\n                $lf=0;$cr=0;$pairs=0\n                for($i=0;$i -lt $bytes.Length;$i++){\n                    if($bytes[$i] -eq 10){$lf++;if($i -gt 0 -and $bytes[$i-1] -eq 13){$pairs++}}\n                    elseif($bytes[$i] -eq 13){$cr++}\n                }\n                $record.lf=$lf;$record.crlf=$pairs;$record.bare_cr=$cr-$pairs\n                $record.reason=if($record.observed_sha256 -ceq $ExpectedHash -and $length -eq $ExpectedSize){'match'}else{'byte-mismatch'}\n            }\n        } finally {$stream.Dispose()}\n    } catch {$record.reason='read-failed'}\n    if($record.reason -ceq 'match'){return}\n    $json=$record | ConvertTo-Json -Compress\n    if([Text.Encoding]::UTF8.GetByteCount($json) -gt 2048){throw 'Checkout diagnostic bound'}\n    # GitHub retains this bounded JSON in the step log even before the setup evidence directory exists.\n    Write-Host ('WF_CHECKOUT_FAILURE '+$json)\n    throw 'Checkout authentication failed'\n}\n$tool=Join-Path $env:GITHUB_WORKSPACE 'tools/installer-lifecycle'\nAssert-CheckoutBytes -Path (Join-Path $tool 'prepare_hosted.py') -Name 'prepare_hosted.py' -ExpectedHash 'cca0b9b066db0c20c0493fcd96584ec413535578a1244a45ff70050016e95450' -ExpectedSize 12151\nAssert-CheckoutBytes -Path (Join-Path $tool 'execution-plan.json') -Name 'execution-plan.json' -ExpectedHash 'd6f01112242d57100784811ee59cc682a32342ed8c3a9f6b3019132348c3d814' -ExpectedSize 5184\nAssert-CheckoutBytes -Path (Join-Path $tool 'execution-capsule.zip') -Name 'execution-capsule.zip' -ExpectedHash '3149cd016b22d246cab297b281984b0693dfd2e8ef325ec6529fa2a057351482' -ExpectedSize 56172\npython -I -B (Join-Path $tool 'prepare_hosted.py') --lane fresh --plan (Join-Path $tool 'execution-plan.json') --plan-sha256 'd6f01112242d57100784811ee59cc682a32342ed8c3a9f6b3019132348c3d814' --approval-code $env:WF_APPROVAL --expected-revision $env:WF_REVISION\nif($LASTEXITCODE -ne 0){exit $LASTEXITCODE}\n"
        },
        {
          "name": "Run reviewed fresh lane once",
          "timeout-minutes": 20,
          "run": "$ErrorActionPreference='Stop'\n$preparedRoot=(Join-Path $env:RUNNER_TEMP 'wf-lifecycle-inputs-56331b3cf9b64f4c85adf6cb9d15962c')\n$prepared=Get-Content -LiteralPath (Join-Path $preparedRoot 'prepared.json') -Raw | ConvertFrom-Json\n$review=Join-Path $preparedRoot 'review'\n$controller=Join-Path $review 'harness/controller.ps1';$common=Join-Path $review 'harness/common.ps1'\nif((Get-FileHash -LiteralPath $controller).Hash.ToLowerInvariant() -cne '348c10367abe090b2651d3464733070b0f5eabe8656f5108475f9e15342804b7' -or (Get-FileHash -LiteralPath $common).Hash.ToLowerInvariant() -cne 'f145dfd880b17074e8c640a738ac4d5c1bafcf6469045ac4899aca81da7a9daf'){throw 'Controller bootstrap identity mismatch'}\n& $controller -ReviewRoot $review -Artifacts (Join-Path $preparedRoot 'artifacts') -Authorization (Join-Path $preparedRoot 'authorization.json') -AuthorizationSha256 $prepared.authorization_sha256 -SourceManifestSha256 '29c381125dde0ff53f927e3e6da987ed0acc276405454add7caa62f9d2711c4d' -Lane fresh\nif($LASTEXITCODE -ne 0){exit $LASTEXITCODE}\n"
        },
        {
          "name": "Preserve bounded diagnostics",
          "if": "${{ always() }}",
          "timeout-minutes": 2,
          "run": "$ErrorActionPreference='Stop'\n$preparedRoot=Join-Path $env:RUNNER_TEMP 'wf-lifecycle-inputs-56331b3cf9b64f4c85adf6cb9d15962c'\n$destination=Join-Path $env:RUNNER_TEMP 'wf-lifecycle-evidence-56331b3cf9b64f4c85adf6cb9d15962c'\n$fallback=Join-Path $env:RUNNER_TEMP 'wf-lifecycle-collection-incomplete-56331b3cf9b64f4c85adf6cb9d15962c.json'\nif((Test-Path -LiteralPath $destination) -or (Test-Path -LiteralPath $fallback)){throw 'Evidence destination reused'}\n[IO.File]::WriteAllText($fallback,'{\"complete\":false,\"reason\":\"collection did not finish\"}')\n\"upload_path=$fallback\" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Append -Encoding utf8\nNew-Item -ItemType Directory -Path $destination | Out-Null\n$failure=$null\ntry {\n    # Preserve setup failures before invoking the reviewed collector, which may exit nonzero.\n    $setup=Join-Path $preparedRoot 'evidence'\n    if(Test-Path -LiteralPath $setup){\n        $setupItems=@(Get-ChildItem -LiteralPath $setup -Force)\n        if($setupItems.Count -gt 10 -or ($setupItems | Measure-Object Length -Sum).Sum -gt 2097152){throw 'Setup evidence bound'}\n        foreach($f in $setupItems){\n            if($f.PSIsContainer -or $f.Attributes -band [IO.FileAttributes]::ReparsePoint -or $f.Name -notmatch '^[A-Za-z0-9.-]+\\.json$' -or $f.Length -gt 5242880){throw 'Unsafe setup evidence'}\n            [IO.File]::Copy($f.FullName,(Join-Path $destination ('setup-'+$f.Name)),$false)\n        }\n    }\n    $owned='C:\\wf-lifecycle-ci-56331b3cf9b64f4c85adf6cb9d15962c'\n    if((Test-Path -LiteralPath (Join-Path $preparedRoot 'prepared.json')) -and (Test-Path -LiteralPath $owned)){\n        $collector=Join-Path $preparedRoot 'review/harness/collect.ps1';$common=Join-Path $preparedRoot 'review/harness/common.ps1'\n        if((Get-FileHash -LiteralPath $collector).Hash.ToLowerInvariant() -cne 'd0f65c6c1db5983c687a47aa259f42300e00097e70def72b9f4fa12d07131dd2' -or (Get-FileHash -LiteralPath $common).Hash.ToLowerInvariant() -cne 'f145dfd880b17074e8c640a738ac4d5c1bafcf6469045ac4899aca81da7a9daf'){throw 'Collector identity mismatch'}\n        & (Get-Process -Id $PID).Path -NoLogo -NoProfile -NonInteractive -File $collector -Root $owned -Destination (Join-Path $destination 'harness')\n        if($LASTEXITCODE -ne 0){$failure='HarnessCollectionFailed'}\n    } else {\n        $failure='ControllerEvidenceUnavailable'\n    }\n    $entries=@(Get-ChildItem -LiteralPath $destination -Force -Recurse)\n    if(@($entries | Where-Object { $_.Attributes -band [IO.FileAttributes]::ReparsePoint }).Count){throw 'Linked collection'}\n    $items=@($entries | Where-Object {-not $_.PSIsContainer})\n    $bytes=($items | Measure-Object Length -Sum).Sum\n    if($items.Count -gt 99 -or $bytes -gt 52428800){throw 'Combined evidence bound'}\n    $inventory=@($items | ForEach-Object {@{path=[IO.Path]::GetRelativePath($destination,$_.FullName);size=$_.Length;sha256=(Get-FileHash -LiteralPath $_.FullName).Hash.ToLowerInvariant()}})\n    $record=@{run_id=$env:GITHUB_RUN_ID;invocation='56331b3cf9b64f4c85adf6cb9d15962c';lane='fresh';collection_failure=$failure;files=$inventory} | ConvertTo-Json -Depth 8\n    $encoded=[Text.UTF8Encoding]::new($false).GetBytes($record)\n    if($encoded.Length -gt 5242880 -or $bytes+$encoded.Length -gt 52428800){throw 'Final evidence bound'}\n    [IO.File]::WriteAllBytes((Join-Path $destination 'transfer-manifest.json'),$encoded)\n    \"upload_path=$destination\" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Append -Encoding utf8\n    if($failure){throw 'Evidence collection incomplete'}\n} catch {\n    [IO.File]::WriteAllText($fallback,(@{complete=$false;error_class=$_.Exception.GetType().Name;run_id=$env:GITHUB_RUN_ID;invocation='56331b3cf9b64f4c85adf6cb9d15962c'} | ConvertTo-Json -Compress))\n    throw 'Evidence collection incomplete; bounded diagnostics retained'\n}\n",
          "id": "collect"
        },
        {
          "name": "Upload synthetic lifecycle evidence",
          "if": "${{ always() }}",
          "timeout-minutes": 8,
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "WF-lifecycle-fresh-${{ github.run_id }}",
            "path": "${{ steps.collect.outputs.upload_path }}",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        }
      ]
    },
