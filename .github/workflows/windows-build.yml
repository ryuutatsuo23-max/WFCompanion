name: Windows build
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Install pinned Python dependencies
        run: |
          python -m pip install -r tools/distribution/requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install verified Inno Setup compiler
        run: |
          $compilerSetup = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $compilerSetup
          $expected = '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f'
          if ((Get-FileHash -LiteralPath $compilerSetup -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Inno Setup digest mismatch' }
          $install = Start-Process -FilePath $compilerSetup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/ALLUSERS' -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Compiler install failed: $($install.ExitCode)" }
          if (-not (Test-Path -LiteralPath 'C:\Program Files\Inno Setup 7\ISCC.exe')) { throw 'Compiler not found' }
      - name: Public package and preference checks
        run: |
          python -B -m unittest discover -s tools/distribution -p 'test_*.py' -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($suite in @('test_release_updates.py','test_first_run.py','test_public_appearance.py','test_navigation_startup.py','test_update_flow.py','test_character_overview.py','test_profession_observations*.py','test_close_behavior.py')) {
            python -B -m unittest discover -s tools/qt_preview -p $suite -q
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build public installer
        run: |
          python -B tools/distribution/build_installer.py --public --iscc 'C:\Program Files\Inno Setup 7\ISCC.exe'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify packaged startup and licence
        run: |
          $stage = Get-ChildItem -LiteralPath build -Directory -Filter 'installer-*' | Sort-Object Name | Select-Object -Last 1
          $appDir = Join-Path $stage.FullName 'dist/WFCompanion'
          $notice = Join-Path $appDir '_internal/payload/notices/WFCompanion-LICENSE.txt'
          if ((Get-FileHash -LiteralPath $notice).Hash -ne (Get-FileHash -LiteralPath LICENSE).Hash) { throw 'Missing or changed project licence' }
          $smokeDir = Join-Path $env:RUNNER_TEMP 'wfcompanion-smoke'
          $app = Start-Process -FilePath (Join-Path $appDir 'WFCompanion.exe') -ArgumentList @('--smoke-test',$smokeDir) -WindowStyle Hidden -Wait -PassThru
          if ($app.ExitCode -ne 0 -or -not (Test-Path -LiteralPath (Join-Path $smokeDir 'smoke-ok.txt'))) { throw 'Packaged startup failed' }
          git rev-parse HEAD | Set-Content -LiteralPath dist/source-commit.txt
          python -m pip freeze | Set-Content -LiteralPath dist/build-dependencies.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: WFCompanion-Windows-unsigned
          path: dist/
          if-no-files-found: error
          retention-days: 14
